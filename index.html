<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glucose Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --card: #171d2e;
    --card-border: #232b40;
    --text: #e8ecf5;
    --muted: #8892a6;
    --accent: #4f8cff;
    --green: #2ecc71;
    --amber: #f5a623;
    --red: #ff5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Inter, Arial, sans-serif;
    background: radial-gradient(circle at top left, #17203a, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 22px; margin: 0; letter-spacing: 0.3px; }
  header h1 span { color: var(--accent); }

  .live-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
    background: var(--card); border: 1px solid var(--card-border);
    padding: 6px 14px; border-radius: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
  }

  .main-reading { text-align: center; position: relative; }
  .main-reading .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .main-reading .value { font-size: 64px; font-weight: 700; line-height: 1; margin: 8px 0; transition: color 0.3s; }
  .main-reading .unit { font-size: 16px; color: var(--muted); font-weight: 400; }
  .status-pill {
    display: inline-block; margin-top: 12px; padding: 6px 18px;
    border-radius: 20px; font-weight: 600; font-size: 13px; letter-spacing: 0.5px;
  }
  .status-pill.in-range { background: rgba(46,204,113,0.15); color: var(--green); }
  .status-pill.low { background: rgba(255,91,91,0.15); color: var(--red); }
  .status-pill.high { background: rgba(255,91,91,0.15); color: var(--red); }
  .status-pill.waiting { background: rgba(136,146,166,0.15); color: var(--muted); }
  .updated { margin-top: 14px; font-size: 12px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat-box { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; text-align: center; }
  .stat-box .num { font-size: 22px; font-weight: 700; }
  .stat-box .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  .chart-card canvas { max-height: 280px; }
  .chart-card h3 { margin: 0 0 16px 0; font-size: 15px; color: var(--muted); font-weight: 600; }

  .signal-row { display: flex; gap: 14px; margin-top: 18px; }
  .signal-box { flex: 1; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--muted); }
  .signal-box b { display: block; color: var(--text); font-size: 15px; margin-top: 2px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Glucose<span>Monitor</span></h1>
    <div class="live-badge"><span class="dot"></span> <span id="connStatus">Connecting…</span></div>
  </header>

  <div class="grid">
    <div class="card main-reading">
      <div class="label">Current Reading</div>
      <div class="value" id="current">--<span class="unit"> mg/dL</span></div>
      <div class="status-pill waiting" id="status">Waiting for data</div>
      <div class="updated" id="updated">Last updated: --</div>

      <div class="signal-row">
        <div class="signal-box">IR (DC avg)<b id="irVal">--</b></div>
        <div class="signal-box">Red (DC avg)<b id="redVal">--</b></div>
        <div class="signal-box">Signal quality<b id="qualVal">--</b></div>
      </div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat-box"><div class="num" id="avgVal">--</div><div class="lbl">Average</div></div>
        <div class="stat-box"><div class="num" id="minVal">--</div><div class="lbl">Lowest</div></div>
        <div class="stat-box"><div class="num" id="maxVal">--</div><div class="lbl">Highest</div></div>
        <div class="stat-box"><div class="num" id="countVal">--</div><div class="lbl">Readings shown</div></div>
      </div>
    </div>
  </div>

  <div class="card chart-card">
    <h3>Recent history</h3>
    <canvas id="historyChart"></canvas>
  </div>

  <footer>DES371S — IoT-Based Non-Invasive Glucose Monitoring · Live data from Supabase</footer>
</div>

<script>

  const SUPABASE_URL = "https://veezkcfkrxfzvyzelbnr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZXprY2ZrcnhmenZ5emVsYm5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTcxOTQsImV4cCI6MjEwMjM3MzE5NH0.Yj8Z6yI3zZMBqCu1RatzqnaV-NQRNdw5e9u3ITLy37A";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const MAX_POINTS = 30;

  const ctx = document.getElementById('historyChart').getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 280);
  gradient.addColorStop(0, 'rgba(79,140,255,0.35)');
  gradient.addColorStop(1, 'rgba(79,140,255,0)');

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Glucose (mg/dL)',
        data: [],
        borderColor: '#4f8cff',
        backgroundColor: gradient,
        fill: true,
        tension: 0.35,
        pointRadius: 3,
        pointBackgroundColor: '#4f8cff'
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { suggestedMin: 60, suggestedMax: 200, grid: { color: '#232b40' }, ticks: { color: '#8892a6' } },
        x: { grid: { display: false }, ticks: { color: '#8892a6' } }
      }
    }
  });

  function fmtTime(ts) {
    if (!ts) return '--';
    return new Date(ts).toLocaleTimeString();
  }

  function updateUI(entries) {
    if (!entries || entries.length === 0) return;
    const latest = entries[entries.length - 1];
    const g = Number(latest.glucose_mg_dl);

    document.getElementById('current').innerHTML = g.toFixed(1) + '<span class="unit"> mg/dL</span>';
    document.getElementById('updated').innerText = 'Last updated: ' + fmtTime(latest.created_at || Date.now());
    document.getElementById('irVal').innerText = latest.ir_value ?? '--';
    document.getElementById('redVal').innerText = latest.red_value ?? '--';
    document.getElementById('qualVal').innerText = latest.signal_quality ?? '--';

    const statusEl = document.getElementById('status');
    if (g < 70) { statusEl.innerText = 'LOW'; statusEl.className = 'status-pill low'; }
    else if (g > 180) { statusEl.innerText = 'HIGH'; statusEl.className = 'status-pill high'; }
    else { statusEl.innerText = 'In range'; statusEl.className = 'status-pill in-range'; }

    const values = entries.map(e => Number(e.glucose_mg_dl));
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    document.getElementById('avgVal').innerText = avg.toFixed(0);
    document.getElementById('minVal').innerText = Math.min(...values).toFixed(0);
    document.getElementById('maxVal').innerText = Math.max(...values).toFixed(0);
    document.getElementById('countVal').innerText = values.length;

    chart.data.labels = entries.map(e => fmtTime(e.created_at));
    chart.data.datasets[0].data = values;
    chart.update();
  }

  let history = [];

  async function loadInitial() {
    const { data, error } = await supabase
      .from('readings')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(MAX_POINTS);

    if (error) {
      console.error(error);
      document.getElementById('connStatus').innerText = 'Read error — check RLS policy';
      return;
    }
    history = data || [];
    updateUI(history);
    document.getElementById('connStatus').innerText = 'Live';
  }

  loadInitial();

  
  supabase
    .channel('readings-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'readings' },
      (payload) => {
        history.push(payload.new);
        if (history.length > MAX_POINTS) history.shift();
        updateUI(history);
      })
    .subscribe();

  
  setInterval(loadInitial, 10000);
</script>
</body>
</html>
